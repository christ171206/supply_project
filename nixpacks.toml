[nixpacks]
providers = ["php", "nodejs-npm"]

[build.env]
LOG_CHANNEL = "stdout"
APP_ENV = "production"
APP_DEBUG = "false"

[install.apt]
packages = ["libmysqlclient-dev", "libpng-dev", "libjpeg-dev", "libfreetype6-dev"]

[phases.setup]
cmds = ["apt-get update && apt-get install -y libmysqlclient-dev"]

[phases.installer]
cmds = [
  "composer install --optimize-autoloader --no-dev --no-interaction --ignore-platform-reqs",
  "npm ci --prefer-offline --no-audit"
]

[phases.build]
cmds = [
  "npm run build",
  "mkdir -p storage/framework/{sessions,views,cache} storage/logs bootstrap/cache",
  "chmod -R 777 storage bootstrap/cache"
]

[phases.release]
cmds = [
  "php artisan migrate --force || true",
  "php artisan db:seed --force || true",
  "php artisan config:cache || true",
  "php artisan route:cache || true",
  "php artisan view:cache || true"
]

[start]
cmd = "vendor/bin/heroku-php-apache2 public/"

