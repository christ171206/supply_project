<!DOCTYPE html>
<html>
<head>
    <title>Test Images</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .test { margin: 20px 0; padding: 10px; border: 1px solid #ddd; }
        img { max-width: 200px; margin: 10px 0; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>🔍 Test Images - Supply</h1>

    <h2>Catégories</h2>
    <div class="test">
        <h3>Ordinateurs Portables</h3>
        <img src="/storage/categories/Ordinateurs Portables.jpg" alt="Test" onerror="this.style.border='3px solid red'">
        <p id="test1"></p>
    </div>

    <div class="test">
        <h3>Clavier</h3>
        <img src="/storage/categories/Clavier.jpg" alt="Test" onerror="this.style.border='3px solid red'">
        <p id="test2"></p>
    </div>

    <h2>Produits</h2>
    <div class="test">
        <h3>Apple Magic Trackpad 2 1</h3>
        <img src="/storage/produits/Apple Magic Trackpad 2 1.jpg" alt="Test" onerror="this.style.border='3px solid red'">
        <p id="test3"></p>
    </div>

    <hr>
    <h2>URLs à vérifier dans Network (F12):</h2>
    <ul>
        <li>/storage/categories/Ordinateurs Portables.jpg</li>
        <li>/storage/categories/Clavier.jpg</li>
        <li>/storage/produits/Apple Magic Trackpad 2 1.jpg</li>
    </ul>

    <script>
        document.querySelectorAll('img').forEach((img, i) => {
            img.onload = () => {
                document.getElementById('test' + (i+1)).innerHTML = '✅ Image chargée';
                document.getElementById('test' + (i+1)).className = 'success';
            };
            img.onerror = () => {
                document.getElementById('test' + (i+1)).innerHTML = '❌ Erreur: ' + img.src;
                document.getElementById('test' + (i+1)).className = 'error';
            };
        });
    </script>
</body>
</html>
